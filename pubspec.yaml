name: mindflow
description: "MindFlow – Your thoughts. Connected."
publish_to: none
version: 0.6.0+6

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.4
  uuid: ^4.4.0
  # Lokale Datenbank (SQLite) ohne Code-Generator.
  sqlite3: ^2.4.6
  # Bringt SQLite für iOS und Windows mit.
  sqlite3_flutter_libs: ^0.5.24
  # PDFs anzeigen (Seiten als Bild), PDFs erzeugen und teilen.
  printing: ^5.13.0
  pdf: ^3.11.0
  # Dateien auswählen (PDF-Import), iOS und Windows.
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
