name: mindflow
description: "MindFlow – Your thoughts. Connected."
publish_to: none
version: 0.9.7+22

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.4
  uuid: ^4.4.0
  # Lokale Datenbank (SQLite) ohne Code-Generator.
  sqlite3: ^2.4.6
  # Bringt SQLite für iOS und Windows mit.
  sqlite3_flutter_libs: ^0.5.24
  # PDFs anzeigen mit PDFium (wie Chrome): Seiten samt Formularfeldern und
  # Anmerkungen, Text zum Durchsuchen, Links.
  pdfrx: ^2.11.0
  # Links aus PDFs öffnen.
  url_launcher: ^6.3.2
  # PDFs erzeugen und teilen (Export).
  printing: ^5.13.0
  pdf: ^3.11.0
  # Dateien auswählen (PDF-Import), iOS und Windows.
  file_selector: ^1.0.3
  # Bilder aus der Fotomediathek einfügen.
  image_picker: ^1.1.2
  # Datensicherung: ZIP erstellen und teilen.
  archive: ^3.6.1
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
